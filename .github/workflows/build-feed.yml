name: Build RSS feed

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feed
        env:
          CALENDAR_URLS: ${{ secrets.CALENDAR_URLS }}
          FEED_PUBLIC_URL: ${{ secrets.FEED_PUBLIC_URL }}
        run: python build_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git diff --quiet --cached || git commit -m "Update RSS feed"
          git push
